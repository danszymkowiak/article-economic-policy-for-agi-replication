extraction:
  extractor: a fresh Claude Code subagent that sees ONLY the article text and the rule below
    (no paper, no Table 4, no study design); extractor model id, prompt hash and run date are
    logged in the packet header.
  output: verbatim spans (section heading, exact text), no rewriting, no merging, no ellipses.
  verification: a script checks every span is an exact substring of the fetched text at the pinned
    revision; spans failing the check are rejected, not repaired.
  include: >-
    Empirical results: studies, pilots, experiments, measured effects, programme outcomes,
    statistics and figures, and criticisms that cite data or observed outcomes.
  exclude: >-
    Definitions, history and origins, philosophy and ethical argument, proposals and advocacy,
    theory with no data, opinions with no cited evidence, navigation and "see also" text.
  empty_ok: a policy with no qualifying text gets an empty packet with a note saying so.
  attribution: each packet carries article titles, revision links, fetch date, CC BY-SA 4.0
    licence, and the extractor identity.
