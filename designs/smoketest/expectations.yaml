# Fixed BEFORE any smoketest run. Scores are 0-100, averaged over personas and repeats.
min_ok_rate: 0.9          # share of jobs whose response validated against the schema
greater:                  # better must beat worse by at least `margin` points
  - {criterion: crit_savings, better: sm_led_all, worse: sm_led_closet, margin: 10}
  - {criterion: crit_savings, better: sm_led_closet, worse: sm_lights_on, margin: 10}
  - {criterion: crit_savings, better: sm_led_all, worse: sm_lights_on, margin: 30}
close:                    # paraphrases of one action must land within `tolerance` points
  - {criterion: crit_savings, a: sm_charger_a, b: sm_charger_b, tolerance: 10}
