# DRAFT for user review (TASK-16, v2.1 design; prereg section 4, reconstruction.md section 2).
# The paper's 11 household-facing policies: names and definitions are paper Table 3, verbatim
# (line breaks and the hyphenation of "designed" undone). Order is Table 3's (Panel A, then
# Panel B), which fixes the neutral codes P1..P11 used by the description-only cell Q1.
# Ids match the evidence packet file names (evidence/packets/<id>.md).
# blinded_description is the definition itself: in Q1 the definition is the only identifier
# (shown under the code, never with the name). None of the definitions contains a policy name or
# acronym (checked by tests/bootstrap/test_prompt_files.py).
# Panel A: Targeted & Work-Conditioned Policies
- id: eitc
  name: Earned Income Tax Credit (EITC)
  description: &eitc >-
    A means-tested, refundable tax credit functioning as a wage subsidy for low-to-moderate-income
    working households.
  blinded_description: *eitc
- id: ui
  name: Unemployment Insurance (UI)
  description: &ui >-
    A stabilizer that provides temporary partial wage replacement to workers who lose employment.
  blinded_description: *ui
- id: almp
  name: Active Labour-Market Policies (ALMP)
  description: &almp >-
    Typically state-sponsored training and job-search assistance programs designed to realign
    workers’ skills with AI-complementary occupations.
  blinded_description: *almp
- id: wage_insurance
  name: Wage Insurance
  description: &wage_insurance >-
    A transitional earnings subsidy that compensates displaced workers for a portion of the wage
    loss incurred when securing re-employment at a lower wage.
  blinded_description: *wage_insurance
- id: directed_industrial_policy
  name: Directed Industrial Policy
  description: &directed_industrial_policy >-
    Strategic state funding for public good projects, to address market failures, and to generate
    new sources of employment.
  blinded_description: *directed_industrial_policy
- id: fjg
  name: Federal Jobs Guarantee (FJG)
  description: &fjg >-
    Publicly funded direct employment, whereby the state acts as the employer of last resort,
    ensuring a job for any individual willing to work.
  blinded_description: *fjg
# Panel B: Universal Floors, Services & Ownership
- id: ubi
  name: Universal Basic Income (UBI)
  description: &ubi >-
    An unconditional cash transfer delivered uniformly to all citizens regardless of income,
    wealth, or employment status.
  blinded_description: *ubi
- id: nit
  name: Negative Income Tax (NIT)
  description: &nit >-
    A tax-transfer schedule that establishes a guaranteed minimum income floor, automatically
    providing cash transfers to households below an income threshold that phase out smoothly as
    market earnings rise.
  blinded_description: *nit
- id: ubs
  name: Universal Basic Services (UBS)
  description: &ubs >-
    The direct and unconditional public provision of essential in-kind benefits—such as
    healthcare, childcare, education, housing, and transit—at zero or subsidized user costs.
  blinded_description: *ubs
- id: ubc
  name: Universal Basic Capital (UBC)
  description: &ubc >-
    The state-facilitated sharing of an ex-ante capital endowment or diversified equity stake in
    the productive economy (e.g., citizen wealth accounts or public trust shares).
  blinded_description: *ubc
- id: sawf
  name: Sovereign AI Fund / Dividend (SAWF)
  description: &sawf >-
    A public wealth fund that captures returns from AI sector economic gains through public
    equity or profit taxation to distribute universal cash dividends to citizens.
  blinded_description: *sawf
